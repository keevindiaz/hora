   name: Compilar APK del reloj

   on:
     push:
       paths:
         - 'android/**'
         - '.github/workflows/apk.yml'
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: '17'

         - uses: gradle/actions/setup-gradle@v4
           with:
             gradle-version: '8.9'

         - name: Compilar
           working-directory: android
           run: gradle --no-daemon assembleRelease

         - name: Renombrar
           run: cp android/app/build/outputs/apk/release/app-release.apk reloj.apk

         - uses: actions/upload-artifact@v4
           with:
             name: reloj-apk
             path: reloj.apk
