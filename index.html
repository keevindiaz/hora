<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reloj</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; background: #fff; overflow: hidden; }
    #app {
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 1.5rem 1rem; font-family: 'Outfit', sans-serif;
    }
    .days-row { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; justify-content: center; }
    .day-pill {
      font-size: 13px; font-weight: 400; letter-spacing: 0.1em;
      text-transform: uppercase; color: #ccc; padding: 5px 13px;
      border-radius: 30px; border: 1.5px solid #eee;
    }
    .day-pill.today { color: #cc0000; border-color: #cc0000; background: rgba(204,0,0,0.06); font-weight: 600; }
    .time-display {
      font-family: 'Bebas Neue', sans-serif; font-size: 200px;
      color: #cc0000; letter-spacing: 0.02em; line-height: 0.9; margin-bottom: 0.1rem;
    }
    .date-display {
      font-size: 14px; color: #bbb; letter-spacing: 0.18em;
      text-transform: uppercase; margin-bottom: 2rem; font-weight: 300;
    }
    .divider { width: 60px; height: 2px; background: #cc0000; opacity: 0.2; margin: 0 0 2rem; }
    .weather-row { display: flex; align-items: center; gap: 2rem; }
    .temp-main { font-family: 'Bebas Neue', sans-serif; font-size: 72px; color: #cc0000; line-height: 1; text-align: center; }
    .temp-range { font-size: 12px; color: #ccc; margin-top: 4px; letter-spacing: 0.08em; text-align: center; }
    .weather-info { border-left: 1.5px solid #eee; padding-left: 2rem; }
    .weather-desc { font-size: 18px; color: #555; font-weight: 300; margin-bottom: 6px; }
    .weather-detail { font-size: 12px; color: #ccc; line-height: 2; }
    .weather-detail span { color: #aaa; }
    .footer { margin-top: 2rem; font-size: 10px; color: #ddd; letter-spacing: 0.08em; display: flex; align-items: center; gap: 5px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: #cc0000; opacity: 0.4; animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:0.4;} 50%{opacity:0.1;} }
    .msg { color: #bbb; font-size: 14px; }
    @media (max-width: 700px) { .time-display{font-size:130px;} .temp-main{font-size:56px;} }
    @media (max-width: 480px) { .time-display{font-size:96px;} .temp-main{font-size:48px;} .weather-row{gap:1.2rem;} .weather-info{padding-left:1.2rem;} }
    @media (max-width: 360px) { .time-display{font-size:78px;} .day-pill{font-size:11px;padding:4px 9px;} }
  </style>
</head>
<body>
<div id="app">
  <div class="days-row" id="days-row"></div>
  <div class="time-display" id="time">--:--</div>
  <div class="date-display" id="date">cargando...</div>
  <div class="divider"></div>
  <div class="weather-row" id="weather-row"><div class="msg">obteniendo clima...</div></div>
  <div class="footer"><span class="dot"></span>Villa Ballester · actualizado por GitHub Actions</div>
</div>

<script>
var DAYS   = ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'];
var MONTHS = ['enero','febrero','marzo','abril','mayo','junio',
              'julio','agosto','septiembre','octubre','noviembre','diciembre'];

var DESC = {
  'Sunny':'Soleado','Clear':'Despejado','Clear ':'Despejado',
  'Partly cloudy':'Parcialmente nublado','Partly Cloudy':'Parcialmente nublado','Partly Cloudy ':'Parcialmente nublado',
  'Cloudy':'Nublado','Cloudy ':'Nublado','Overcast':'Cubierto',
  'Mist':'Neblina','Fog':'Niebla',
  'Light rain':'Lluvia leve','Moderate rain':'Lluvia moderada','Heavy rain':'Lluvia intensa',
  'Light drizzle':'Llovizna leve','Drizzle':'Llovizna',
  'Light snow':'Nieve leve','Moderate snow':'Nieve moderada','Heavy snow':'Nieve intensa',
  'Thundery outbreaks possible':'Tormenta posible','Patchy rain nearby':'Lluvia cercana',
  'Blowing snow':'Nieve con viento','Blizzard':'Ventisca',
  'Light sleet':'Aguanieve leve','Moderate or heavy sleet':'Aguanieve',
  'Ice pellets':'Granizo','Light rain shower':'Chubascos leves',
  'Moderate or heavy rain shower':'Chubascos moderados','Torrential rain shower':'Lluvia torrencial',
  'Light snow showers':'Nieve leve','Moderate or heavy snow showers':'Nieve moderada',
  'Thunder':'Tormenta','Patchy light rain':'Lluvia leve'
};

function tr(s){ return DESC[s] || (s ? s.trim() : 'Variable'); }
function pad(n){ return n < 10 ? '0'+n : ''+n; }

function renderDays(){
  var today = new Date().getDay();
  var row = document.getElementById('days-row');
  row.innerHTML = '';
  for(var i = 0; i < 7; i++){
    var p = document.createElement('div');
    p.className = 'day-pill' + (i === today ? ' today' : '');
    p.textContent = DAYS[i];
    row.appendChild(p);
  }
}

function updateClock(){
  var n = new Date();
  document.getElementById('time').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
  document.getElementById('date').textContent =
    DAYS[n.getDay()] + ', ' + n.getDate() + ' de ' + MONTHS[n.getMonth()] + ' ' + n.getFullYear();
}

function showWeather(temp, tmax, tmin, desc, wind){
  document.getElementById('weather-row').innerHTML =
    '<div style="text-align:center">' +
      '<div class="temp-main">' + temp + '&#176;C</div>' +
      '<div class="temp-range">&#8593;' + tmax + '&#176;&nbsp; &#8595;' + tmin + '&#176;</div>' +
    '</div>' +
    '<div class="weather-info">' +
      '<div class="weather-desc">' + desc + '</div>' +
      '<div class="weather-detail">Viento <span>' + wind + ' km/h</span></div>' +
    '</div>';
}

function showError(m){
  document.getElementById('weather-row').innerHTML = '<div class="msg">' + m + '</div>';
}

function getWeather(){
  /* Lee clima.json desde el mismo dominio github.io — sin certificado externo */
  var x = new XMLHttpRequest();
  /* Cache-busting para que KitKat no sirva el archivo viejo */
  var url = 'clima.json?t=' + new Date().getTime();
  x.open('GET', url, true);
  x.timeout = 10000;

  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    if(x.status === 200){
      try{
        var d  = JSON.parse(x.responseText);
        var cc = d.current_condition[0];
        var wd = d.weather[0];
        showWeather(
          Math.round(cc.temp_C),
          Math.round(wd.maxtempC),
          Math.round(wd.mintempC),
          tr(cc.weatherDesc[0].value),
          Math.round(cc.windspeedKmph)
        );
      } catch(e){
        showError('error al leer clima');
      }
    } else {
      showError('clima.json no encontrado (' + x.status + ')');
    }
  };

  x.ontimeout = function(){ showError('timeout'); };
  x.onerror   = function(){ showError('sin conexion'); };
  try{ x.send(); } catch(e){ showError('error: ' + e.message); }
}

renderDays();
updateClock();
getWeather();

setInterval(updateClock, 1000);
setInterval(renderDays,  60000);
setInterval(getWeather,  600000);
</script>
</body>
</html>
