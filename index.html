<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reloj</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100vh;
      overflow-y: auto;
      font-family: 'Rajdhani', sans-serif;
      background: #111;
      color: #fff;
      user-select: none;
    }

    .layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 100vh;
      padding: 16px 12px 24px;
      gap: 16px;
    }

    /* --- Días --- */
    .days {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 12px;
      font-size: 36px;
      width: 100%;
    }

    .days span {
      padding: 10px 0;
      width: 100%;
      text-align: center;
      border-radius: 8px;
      color: #555;
      transition: background 0.3s, color 0.3s;
    }

    .days .active {
      background: #ff3c3c;
      color: #fff;
      font-weight: 700;
    }

    /* --- Reloj --- */
    .clock {
      width: 100%;
      text-align: center;
      font-size: clamp(150px, 35vw, 55vh);
      font-weight: 700;
      line-height: 1;
      color: #ff3c3c;
      text-shadow: 0 0 20px rgba(255,60,60,0.4);
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: 0.02em;
    }

    /* --- Fecha --- */
    .fecha {
      font-size: clamp(18px, 2.5vw, 28px);
      color: #555;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* --- Clima --- */
    .weather-block {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .weather-temp {
      display: flex;
      flex-direction: column;
      font-size: clamp(28px, 5vw, 50px);
      font-weight: 600;
      gap: 6px;
      text-align: center;
      color: #ff3c3c;
    }

    .weather-desc {
      font-size: clamp(18px, 2.5vw, 28px);
      color: #777;
      font-weight: 500;
      text-align: center;
    }

    .weather-detail {
      font-size: clamp(14px, 1.8vw, 22px);
      color: #444;
      text-align: center;
    }

    .weather-detail span { color: #666; }

    /* --- Botón modo noche/día --- */
    #toggle {
      position: fixed;
      top: 1rem; right: 1.2rem;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1.5px solid #222;
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #toggle svg { width: 22px; height: 22px; }
    .icon-sun { display: none; }
    body.day .icon-sun  { display: block; }
    body.day .icon-moon { display: none; }

    /* --- Modo día --- */
    body.day { background: #fff; color: #111; }
    body.day .days span { color: #ccc; }
    body.day .days .active { background: #cc0000; color: #fff; }
    body.day .clock { color: #cc0000; text-shadow: none; }
    body.day .fecha { color: #bbb; }
    body.day .weather-temp { color: #cc0000; }
    body.day .weather-desc { color: #888; }
    body.day .weather-detail { color: #ccc; }
    body.day .weather-detail span { color: #aaa; }
    body.day #toggle { border-color: #eee; }

    .msg { color: #444; font-size: 20px; }
  </style>
</head>
<body>

  <button id="toggle" onclick="toggleMode()" title="Modo día/noche">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1"  x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1"  y1="12" x2="3"  y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
    </svg>
  </button>

  <div class="layout">
    <div class="days" id="days-row"></div>
    <div class="clock" id="time">--:--</div>
    <div class="fecha" id="fecha">cargando...</div>
    <div class="weather-block" id="weather-block">
      <div class="msg">obteniendo clima...</div>
    </div>
  </div>

<script>
var DAYS   = ['Dom','Lun','Mar','Mie','Jue','Vie','Sab'];
var MONTHS = ['enero','febrero','marzo','abril','mayo','junio',
              'julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DESC = {
  'Sunny':'Soleado','Clear':'Despejado','Clear ':'Despejado',
  'Partly cloudy':'Parc. nublado','Partly Cloudy':'Parc. nublado','Partly Cloudy ':'Parc. nublado',
  'Cloudy':'Nublado','Cloudy ':'Nublado','Overcast':'Cubierto',
  'Mist':'Neblina','Fog':'Niebla',
  'Light rain':'Lluvia leve','Moderate rain':'Lluvia moderada','Heavy rain':'Lluvia intensa',
  'Light drizzle':'Llovizna leve','Drizzle':'Llovizna',
  'Light snow':'Nieve leve','Moderate snow':'Nieve moderada','Heavy snow':'Nieve intensa',
  'Thundery outbreaks possible':'Tormenta posible','Patchy rain nearby':'Lluvia cercana',
  'Light rain shower':'Chubascos leves','Moderate or heavy rain shower':'Chubascos',
  'Torrential rain shower':'Lluvia torrencial','Thunder':'Tormenta',
  'Patchy light rain':'Lluvia leve','Blowing snow':'Nieve con viento','Blizzard':'Ventisca'
};
function tr(s){ return DESC[s] || (s ? s.trim() : 'Variable'); }
function pad(n){ return n < 10 ? '0'+n : ''+n; }

/* --- Modo día/noche --- */
try { if(localStorage.getItem('mode') === 'day') document.body.classList.add('day'); } catch(e){}
function toggleMode(){
  document.body.classList.toggle('day');
  try { localStorage.setItem('mode', document.body.classList.contains('day') ? 'day' : 'night'); } catch(e){}
}

/* --- Días --- */
function renderDays(){
  var today = new Date().getDay();
  var row = document.getElementById('days-row');
  row.innerHTML = '';
  for(var i = 0; i < 7; i++){
    var s = document.createElement('span');
    if(i === today) s.className = 'active';
    s.textContent = DAYS[i];
    row.appendChild(s);
  }
}

/* --- Reloj --- */
function updateClock(){
  var n = new Date();
  document.getElementById('time').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
  document.getElementById('fecha').textContent =
    DAYS[n.getDay()] + ', ' + n.getDate() + ' de ' + MONTHS[n.getMonth()] + ' ' + n.getFullYear();
}

/* --- Clima --- */
function getWeather(){
  var x = new XMLHttpRequest();
  x.open('GET', 'clima.json?t=' + new Date().getTime(), true);
  x.timeout = 10000;
  x.onreadystatechange = function(){
    if(x.readyState !== 4) return;
    if(x.status === 200){
      try{
        var d  = JSON.parse(x.responseText);
        var cc = d.current_condition[0];
        var wd = d.weather[0];
        var temp = Math.round(cc.temp_C);
        var tmax = Math.round(wd.maxtempC);
        var tmin = Math.round(wd.mintempC);
        var desc = tr(cc.weatherDesc[0].value);
        var wind = Math.round(cc.windspeedKmph);
        document.getElementById('weather-block').innerHTML =
          '<div class="weather-temp">' +
            '<span>' + temp + '°C</span>' +
            '<span style="font-size:0.5em;color:#555">&#8593;' + tmax + '° &nbsp; &#8595;' + tmin + '°</span>' +
          '</div>' +
          '<div>' +
            '<div class="weather-desc">' + desc + '</div>' +
            '<div class="weather-detail">Viento <span>' + wind + ' km/h</span></div>' +
          '</div>';
      } catch(e){
        document.getElementById('weather-block').innerHTML = '<div class="msg">error al leer clima</div>';
      }
    } else {
      document.getElementById('weather-block').innerHTML = '<div class="msg">sin clima</div>';
    }
  };
  x.ontimeout = function(){ document.getElementById('weather-block').innerHTML = '<div class="msg">timeout</div>'; };
  x.onerror   = function(){ document.getElementById('weather-block').innerHTML = '<div class="msg">sin conexion</div>'; };
  try{ x.send(); } catch(e){}
}

renderDays();
updateClock();
getWeather();
setInterval(updateClock, 1000);
setInterval(renderDays,  60000);
setInterval(getWeather,  600000);
</script>
</body>
</html>
